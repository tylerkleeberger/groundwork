services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always    # langfuse stack already has it; without this the app DB
                       # stays down after a Docker restart (learned 2026-07-06)
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports: ["8302:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
