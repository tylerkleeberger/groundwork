[pytest]
# Repo root on sys.path for every test module (P4-T1 CI finding): `app`
# imports previously resolved only because alphabetically-earlier test
# files inserted paths as a side effect — test_broker.py sorted first
# and broke collection under bare `pytest`. Explicit beats incidental.
pythonpath = .
markers =
    live: needs running services (gateway/Langfuse/Postgres/Ollama) or spends tokens (D16)
    judge: LLM-as-judge layer (P1-T6) — implies live; skip with -m "not judge"
testpaths = tests evals
